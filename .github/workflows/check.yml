name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: flybrain check
      - run: flybrain new ci --universe crypto --cadence 4h
      - run: flybrain flies
